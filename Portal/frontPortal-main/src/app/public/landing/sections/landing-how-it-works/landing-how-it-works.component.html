<section class="how" id="comment">
  <header class="how__head" lpReveal>
    <p class="lp-eyebrow">Pour les patients</p>
    <h2 class="lp-section-title">Comment ça marche ?</h2>
  </header>
  <ol class="how__steps">
    <li class="step lp-lift" *ngFor="let step of steps; let i = index" lpReveal [lpRevealDelay]="i * 120">
      <span class="step__number">{{ i + 1 }}</span>
      <mat-icon class="step__icon" aria-hidden="true">{{ step.icon }}</mat-icon>
      <h3>{{ step.title }}</h3>
      <p>{{ step.text }}</p>
    </li>
  </ol>
</section>
