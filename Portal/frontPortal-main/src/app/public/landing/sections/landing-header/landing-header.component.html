<header class="lp-header" [class.is-scrolled]="scrolled">
  <a class="brand" [routerLink]="['/']" aria-label="PortalMedical accueil">
    <img src="assets/img/favicon.svg" alt="Logo PortalMedical" class="brand__mark">
    <span class="brand__copy">
      <span class="brand__title"><span>Portal</span><span class="brand__accent">Medical</span></span>
      <span class="brand__tagline">Accessible. Sécurisé. Humain.</span>
    </span>
  </a>

  <nav class="lp-header__links" aria-label="Navigation principale">
    <button type="button" (click)="scrollTo('comment')">Comment ça marche</button>
    <button type="button" (click)="scrollTo('medecins')">Pour les médecins</button>
    <button type="button" (click)="scrollTo('faq')">Questions</button>
  </nav>

  <a class="lp-header__pro" [routerLink]="['/connexion']">
    <mat-icon aria-hidden="true">badge</mat-icon><span>Espace professionnel</span>
  </a>
</header>
