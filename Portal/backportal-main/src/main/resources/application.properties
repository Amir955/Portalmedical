### DATABASE ###
spring.datasource.url=jdbc:mysql://localhost:3306/portalmedical
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
### JPA / HIBERNATE ###
# SQL logging off; set to true locally when debugging a query.
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57InnoDBDialect
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
server.port=8085

#Email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

### SECURITY ###
# Base64 key used to sign JWTs (at least 32 chars). Required: the app will not start without it.
jwt.secret=${JWT_SECRET}

### LOCAL SECRETS ###
# Secrets come from environment variables, or from a git-ignored application-local.properties
# next to pom.xml (JWT_SECRET=..., MAIL_USERNAME=..., MAIL_PASSWORD=..., DB_PASSWORD=...).
spring.config.import=optional:file:./application-local.properties,optional:file:./backportal-main/application-local.properties
